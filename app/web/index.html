<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMax H3 工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%20140%20140%22%3E%3Crect%20width%3D%22140%22%20height%3D%22140%22%20rx%3D%2230%22%20fill%3D%22%232b2d30%22/%3E%3Ctext%20x%3D%2270%22%20y%3D%2288%22%20text-anchor%3D%22middle%22%20font-family%3D%22-apple-system%2C%27Segoe%20UI%27%2CHelvetica%2CArial%2Csans-serif%22%20font-size%3D%2264%22%20font-weight%3D%22700%22%20fill%3D%22%23f2f2f2%22%20letter-spacing%3D%22-2%22%3EH3%3C/text%3E%3Crect%20x%3D%2226%22%20y%3D%22106%22%20width%3D%2288%22%20height%3D%229%22%20rx%3D%224.5%22%20fill%3D%22%2348484a%22/%3E%3Crect%20x%3D%2226%22%20y%3D%22106%22%20width%3D%2256%22%20height%3D%229%22%20rx%3D%224.5%22%20fill%3D%22%23ff7a2f%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#131416; --side:#1c1e21; --panel:#1c1e21; --card:#28292c; --chip:#2e3033; --chip-h:#37393d; --line:rgba(255,255,255,.07);
  --tx:#f5f5f6; --tx2:#a1a1a8; --tx3:#6c6c74; --lime:#d1fe17; --lime2:#bfe810; --lime-d:#98b810;
  --red:#ff5470; --amber:#ffb84d; --green:#8be28f; --pink:#fb64b6; --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}

/* 左侧菜单 */
.nav{background:var(--side);border-right:1px solid var(--line);padding:12px 12px 16px;position:sticky;top:0;height:100vh;overflow:hidden auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:10px;background:#232528;border-radius:14px;font-weight:650;font-size:16px}
.brand .lg{display:grid;flex:none}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:#111;flex:none}
.ni{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:13px;font-size:16px;color:#e6e6e8;text-align:left;width:100%;position:relative;text-decoration:none}
.ni:hover{background:#25272a}
.ni.on{background:#2e3033}
.ni .t{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.t.gray{background:linear-gradient(160deg,#a6a6ad,#5b5b62)} .t.cyan{background:linear-gradient(160deg,#7fe3f0,#2f93c4)}
.t.blue{background:linear-gradient(160deg,#6db5ff,#2f62e6)} .t.pink{background:linear-gradient(160deg,#ff9cc8,#e3487f)}
.t.proj{background:#2b2d30;color:var(--fc,var(--tx2));box-shadow:none;border:0}
.t.proj svg path{fill:currentColor}  /* 文件夹实心填色（Peter 11-12 定），不只是描边 */
.pjren{flex:1;min-width:0;background:#131416;border:1px solid var(--lime-d);border-radius:8px;padding:3px 8px;font-size:14px;outline:none;color:var(--tx)}
.pjnew{align-items:flex-start;background:#25272a;cursor:default}
.pjnew .pjn{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-bottom:3px}
.pjnew input{width:100%;background:#131416;border:1px solid var(--lime-d);border-radius:8px;padding:4px 8px;font-size:14px;outline:none}
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pjnew .dots{gap:6px;padding:2px}
.pjnew .cdot{width:13px;height:13px}
.cdot{width:16px;height:16px;border-radius:50%;cursor:pointer;flex:none;box-shadow:0 0 0 2px transparent;transition:transform .1s}
.cdot:hover{transform:scale(1.2)} .cdot.on{box-shadow:0 0 0 2px #1c1e21,0 0 0 4px #fff}
.ni.pj{gap:6px;font-size:15px;padding-top:6px;padding-bottom:6px}
.ni.pj .t{width:26px;height:26px}
.ni.pj .tw{width:16px;height:26px;display:grid;place-items:center;flex:none;color:var(--tx3);border-radius:6px}
.ni.pj .tw svg{display:block;transition:transform .12s} .ni.pj .tw.open svg{transform:rotate(90deg)}
.ni.pj .tw.none{visibility:hidden} .ni.pj .tw:hover{color:var(--tx)}
.ni.pj .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ni.pj .pn small{display:block;font-size:11.5px;color:var(--tx3)}
.ni.pj.drop{outline:1.5px solid #d6d6da;outline-offset:-1.5px;background:#2e3033}
.nav .sec.drop{color:var(--tx);outline:1.5px dashed #8a8a92;border-radius:8px}
.ni .cnt{margin-left:auto;font-size:12px;color:var(--tx3)}
.ni .more{margin-left:auto;width:26px;height:26px;border-radius:8px;display:none;place-items:center;color:var(--tx2)}
.ni:hover .more{display:grid}
.ni:hover .cnt{display:none}
.ni .more:hover{background:#333538}
.sec{display:flex;align-items:center;gap:6px;color:var(--tx3);font-size:13.5px;padding:18px 10px 6px}
.sec .sp{flex:1}
.sec button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--tx3)}
.sec button:hover,.sec button.on{background:#28292c;color:var(--tx)}
.side-in{margin:2px 4px 6px;background:#25272a;border:1px solid #333538;border-radius:10px;padding:7px 10px;font-size:14px;outline:0;width:calc(100% - 8px)}
.side-in:focus{border-color:var(--lime-d)}
.ni.new .t{background:transparent;border:1.5px solid #3d3f43;color:var(--tx2);box-shadow:none}
.ni.new{color:var(--tx2)}
.navfoot{margin-top:auto;padding:14px 6px 0;display:flex;flex-direction:column;gap:8px}
.pill{font-size:12.5px;padding:6px 11px;border-radius:99px;background:var(--chip);color:var(--tx2);display:flex;align-items:center;gap:6px;width:fit-content}
.pill b{width:7px;height:7px;border-radius:50%;background:var(--green)}
.pill.warn b{background:var(--amber)} .pill.bad b{background:var(--red)}
.navfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.quit{font-size:12.5px;color:var(--tx3);padding:6px 10px;border-radius:99px}
.ver{font-size:11.5px;color:var(--tx3);padding:0 4px;width:100%}
.quit:hover{color:var(--red);background:var(--chip)}
.quit-page{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.quit-page h2{margin:0 0 10px;font-size:26px} .quit-page p{color:var(--tx2);margin:4px 0}
.ghost{font-size:13px;color:var(--tx2);padding:7px 12px;border-radius:10px;background:var(--chip);width:fit-content}
.ghost:hover{background:var(--chip-h);color:var(--tx)}

.main{min-width:0;padding:26px 28px 80px}
.inner{max-width:1320px;margin:0 auto}
.banner{background:#2a1d10;border:1px solid #5a3a12;color:#ffd9a3;border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13.5px}
.banner code{background:rgba(0,0,0,.35);padding:2px 7px;border-radius:6px;font-size:12.5px;user-select:all}

/* 页头 */
.vh{display:flex;align-items:flex-end;gap:14px;margin:6px 4px 20px;flex-wrap:wrap}
.vh h1{font-size:30px;margin:0;font-weight:700;letter-spacing:.3px}
.vh h1 input{font-size:30px;font-weight:700;background:transparent;border:0;border-bottom:2px solid var(--lime-d);outline:0;width:min(520px,80vw);padding:0}
.vh .sub{color:var(--tx3);font-size:13.5px;padding-bottom:5px}
.vh .sp{flex:1}
.vh .acts{display:flex;gap:8px;padding-bottom:3px}
.wfadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,2fr) auto;gap:8px;margin:0 0 8px}
.wfadd input,.wfrow input{background:#25272a;border:1px solid #333538;border-radius:10px;padding:9px 12px;font-size:14px;outline:0;min-width:0;color:var(--tx)}
.wfadd input:focus,.wfrow input:focus{border-color:#6c6c74}
.wfadd .go{background:var(--lime);color:#111;font-weight:650;border-radius:10px;padding:0 16px;font-size:14px}
.wfrow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.wfrow.cur{border-color:rgba(255,255,255,.28)}
.wfrow .nm{font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wfrow .nm span[data-w=name]{cursor:text}
.wfrow .tag{font-size:12px;font-weight:500;color:var(--tx2);background:var(--chip);border-radius:6px;padding:1px 8px}
.wfrow .meta{font-size:12.5px;color:var(--tx3);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.wfrow .meta code{font-size:12.5px;color:var(--tx2);cursor:pointer}
.wfrow .ok{color:var(--green)} .wfrow .bad{color:var(--amber);grid-column:1/-1;font-size:13px;line-height:1.6}
.wfrow .acts{display:flex;gap:6px;grid-row:1/3;grid-column:2}
.wfrow .note{color:var(--tx2);cursor:text}
@media(max-width:900px){.wfadd{grid-template-columns:1fr}}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.guide .gh{display:flex;align-items:center;font-weight:650;font-size:15px}
.gstep{display:flex;align-items:center;gap:12px}
.gstep i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:650;background:var(--chip);color:var(--tx2)}
.gstep.ok i{background:rgba(139,226,143,.16);color:var(--green)}
.gstep div{display:flex;flex-direction:column;flex:1;min-width:0}
.gstep b{font-size:14.5px;font-weight:600} .gstep.ok b{color:var(--tx2)}
.gstep span{font-size:12.5px;color:var(--tx3)}
.pstats{display:flex;gap:22px;flex-wrap:wrap;margin:-8px 4px 18px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%}
.pstats div{display:flex;flex-direction:column;gap:1px}
.pstats b{font-size:17px;font-weight:650}
.pstats span{font-size:12px;color:var(--tx3)}
.hero{text-align:center;margin:26px 0 30px}
.hero h1{font-size:40px;margin:0 0 8px;font-weight:750;letter-spacing:1px}
.hero p{margin:0;color:var(--tx3);font-size:14px}

/* 生成区 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:12px}
.top{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0;text-align:left;position:relative}
button.card:hover,.card.click:hover{background:#2e3033}
.card .ico{width:50px;height:50px;border-radius:13px;flex:none;display:grid;place-items:center;background:#1c1e21;border:1px solid var(--line);color:var(--tx2)}
.card .ico.lime{color:var(--lime)}
.card .t{min-width:0;flex:1}
.card .k{font-size:12.5px;color:var(--tx3)}
.card .v{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card input.v{background:transparent;border:0;outline:0;width:100%;padding:0}
.card input.v::placeholder{color:var(--tx3);font-weight:500}

.editor{background:var(--card);border-radius:26px;padding:16px 16px 14px;display:flex;gap:16px}
.ed-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.media{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.media:empty{display:none}
.grp{display:flex;flex-direction:column;gap:6px;padding:6px;margin:-6px;border-radius:16px}
.grp .gl{font-size:12px;color:var(--tx3);padding-left:2px}
.grp .gl em{font-style:normal;color:var(--tx3);opacity:.7;margin-left:4px}
.grp .row{display:flex;gap:8px;flex-wrap:wrap}
.grp.hot{background:rgba(220,255,31,.07);outline:1.5px dashed var(--lime-d)}
.tile{width:84px;height:84px;border-radius:14px;background:#1c1e21;border:1px solid var(--line);position:relative;overflow:hidden;flex:none}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .tag{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:600;background:rgba(0,0,0,.72);padding:1px 6px;border-radius:6px;color:var(--lime);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .dur{position:absolute;right:5px;top:5px;font-size:10.5px;background:rgba(0,0,0,.65);padding:0 5px;border-radius:5px;color:#ddd}
.tile .x{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.75);display:none;place-items:center}
.tile:hover .x{display:grid}
.tile:hover .dur{display:none}
.tile .aud{width:100%;height:100%;display:grid;place-items:center;color:var(--tx2);padding:6px;text-align:center;font-size:10.5px;word-break:break-all}
.tile.add{border:1.5px dashed #3d3f43;background:transparent;display:grid;place-items:center;color:var(--tx3);cursor:pointer}
.tile.add:hover{border-color:var(--tx3);color:var(--tx)}
.tile.slot{border:1.5px dashed #3d3f43;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx3);font-size:12px;cursor:pointer}
.tile.slot.req{border-color:#5b5b2a;color:#c9d48a}
.tile.slot:hover{border-color:var(--tx3);color:var(--tx)}
.tile.pending{display:grid;place-items:center;font-size:11.5px;color:var(--tx2)}
.tile.pending .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--lime)}
.tile[draggable=true]{cursor:grab}
.tile.drop-before{box-shadow:-4px 0 0 var(--lime)}
.shelf{opacity:.55}
.shelf:hover{opacity:.9}

textarea#prompt{width:100%;min-height:96px;resize:vertical;background:transparent;border:0;outline:0;font-size:17px;line-height:1.55;color:var(--tx);padding:4px 2px}
textarea#prompt::placeholder{color:var(--tx3)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{height:44px;border-radius:13px;background:var(--chip);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:16px;font-weight:550;white-space:nowrap;color:var(--tx)}
.chip:hover{background:var(--chip-h)}
.chip svg{color:var(--tx2)}
.chip.icon{width:44px;padding:0;justify-content:center}
.chip.model svg.m{color:var(--lime)}
.chip.dim{color:var(--tx3)}
.chip .chev{opacity:.7}
.chip.sm{height:34px;font-size:13.5px;border-radius:10px;padding:0 12px}
.chip.sm.on{background:#e8e8ea;color:#111}
.stepper{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:13px;height:44px;padding:0 6px}
.stepper button{width:30px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx2);font-size:20px}
.stepper button:hover{background:var(--chip-h);color:var(--tx)}
.stepper button:disabled{opacity:.3;cursor:default;background:none}
.stepper span{min-width:44px;text-align:center;font-weight:650;font-size:16px}
.stepper span small{color:var(--tx3);font-weight:500}
.hint{font-size:12.5px;color:var(--amber);min-height:18px;padding-left:2px}
.hint.ok{color:var(--tx3)}

.foot{display:flex;gap:10px;align-items:flex-start}
.foot .bar{flex:1;min-width:0}
.genbtn{flex:none;height:44px;padding:0 20px 0 18px;border-radius:13px;background:var(--lime);color:#121212;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;white-space:nowrap;transition:filter .1s,transform .08s}
.genbtn:hover{filter:brightness(1.06)}
.genbtn:active{transform:translateY(1px)}
.genbtn small{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;opacity:.72;padding-left:10px;border-left:1px solid rgba(0,0,0,.18)}
.genbtn:disabled{background:#333538;color:#6f6f77;cursor:not-allowed}
.hintrow{display:flex;gap:12px;align-items:baseline}
.hintrow .hint{flex:1}
.hintrow .note{font-size:11.5px;color:var(--tx3);white-space:nowrap}

/* 弹出菜单 */
.pop{position:absolute;z-index:120;background:#28292c;border:1px solid #3d3f43;border-radius:16px;padding:6px;min-width:190px;box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:70vh;overflow:auto}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;text-align:left;font-size:14.5px}
.pop .it:hover{background:#333538}
.pop .it.on{color:var(--lime)}
.pop .it.pk{display:flex;align-items:center;gap:10px} .pop .it.pk span{flex:1;min-width:0}
.pop .it .x{font-style:normal;color:var(--tx3);width:22px;height:22px;display:grid;place-items:center;border-radius:6px;flex:none}
.pop .it .x:hover{background:#3d3f43;color:var(--red)}
.pop .it.danger{color:var(--red)}
.pop .it small{display:block;color:var(--tx3);font-size:12px}
.pop .it.off{opacity:.45}
.pop .hd{font-size:12px;color:var(--tx3);padding:8px 12px 4px}
.pop .rng{padding:10px 12px 12px;width:280px}
.pop .rng .big{font-size:30px;font-weight:700;margin-bottom:6px}
.pop .rng input[type=range]{width:100%;accent-color:var(--lime)}
.pop .rng .q{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pop .rng .q button{padding:5px 11px;border-radius:9px;background:var(--chip);font-size:13px}
.pop .rng .q button:hover{background:var(--chip-h)}
.pop .row2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px}
.pop .row2 .opts{display:flex;gap:4px}
.pop .row2 .opts button{padding:4px 10px;border-radius:8px;background:var(--chip);font-size:13px}
.pop .row2 .opts button.on{background:var(--lime);color:#111}
.pop .muted{font-size:12px;color:var(--tx3);padding:6px 12px 8px;max-width:340px}

/* 生成结果 */
.gal-h{display:flex;align-items:center;gap:10px;margin:34px 4px 14px;flex-wrap:wrap}
.gal-h h2{font-size:18px;margin:0;font-weight:650}
.gal-h .n{color:var(--tx3);font-size:14px}
.gal-h .sp{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.task .vid{aspect-ratio:16/9;background:#0b0b0d;position:relative;display:grid;place-items:center}
.task .vid video{width:100%;height:100%;object-fit:contain;background:#000;cursor:zoom-in}
.task .vid .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.9;transition:opacity .15s}
.task .vid .play i{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center}
.task .vid:hover .play{opacity:0}
.task .st{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--tx2);font-size:14px}
.task .st.err{color:var(--red);padding:0 22px;text-align:center;font-size:13px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #333538;border-top-color:var(--lime);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.task .badge{position:absolute;left:10px;top:10px;font-size:11.5px;padding:2px 8px;border-radius:7px;background:rgba(0,0,0,.6);color:var(--tx2)}
.task .badge.demo{left:auto;right:48px;color:var(--amber)}
.task .badge.len{left:auto;right:10px;top:auto;bottom:10px}
.fav{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#ddd;z-index:2}
.fav:hover{background:rgba(0,0,0,.8)}
.fav.on{color:var(--pink)}
.task .body{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.task .nm{font-weight:600;font-size:14.5px;word-break:break-all}
.task .meta{font-size:12.5px;color:var(--tx3)}
.task .ptag{font-size:11.5px;color:var(--tx2);background:#2b2d30;border-radius:6px;padding:1px 7px;width:fit-content}
.task .pr{font-size:13px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.task .acts button{font-size:12.5px;padding:5px 10px;border-radius:9px;background:var(--chip);color:var(--tx2)}
.task .acts button:hover{background:var(--chip-h);color:var(--tx)}
.empty{color:var(--tx3);font-size:14px;padding:30px 6px;grid-column:1/-1}

/* 我的元素 */
.elems{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.el{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.el .th{aspect-ratio:1;background:#0d0d0f;display:grid;place-items:center;position:relative;color:var(--tx3)}
.el .th img{width:100%;height:100%;object-fit:cover}
.el .th .k{position:absolute;left:8px;top:8px;font-size:11px;background:rgba(0,0,0,.65);padding:1px 7px;border-radius:6px;color:var(--tx2)}
.el .b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px}
.el .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el .mt{font-size:11.5px;color:var(--tx3)}
.el .acts{display:flex;gap:6px}
.el .acts button{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--chip);color:var(--tx2)}
.el .acts button:hover{background:var(--chip-h);color:var(--tx)}
.el .acts button.go{background:var(--lime);color:#111}
.dropzone{border:1.5px dashed #3d3f43;border-radius:18px;padding:22px;text-align:center;color:var(--tx3);margin-bottom:16px;cursor:pointer}
.dropzone:hover{border-color:var(--tx3);color:var(--tx2)}

/* 播放器 */
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,6,8,.94);display:grid;grid-template-columns:minmax(0,1fr) 360px}
.lb-stage{position:relative;display:grid;place-items:center;padding:28px 70px;min-width:0}
.lb-stage video{max-width:100%;max-height:calc(100vh - 56px);border-radius:12px;background:#000;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:#28292c;display:grid;place-items:center;color:var(--tx)}
.lb-nav:hover{background:#333538}
.lb-nav:disabled{opacity:.25;cursor:default}
.lb-nav.prev{left:14px} .lb-nav.next{right:14px}
.lb-info{background:#1c1e21;border-left:1px solid var(--line);padding:22px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.lb-info .top2{display:flex;align-items:center;gap:8px}
.lb-info .top2 .sp{flex:1}
.lb-info h3{margin:0;font-size:16px;word-break:break-all}
.lb-info .kv{font-size:13px;display:grid;grid-template-columns:72px 1fr;gap:6px 10px}
.lb-info .kv div:nth-child(odd){color:var(--tx3)}
.lb-info .pp{white-space:pre-wrap;background:#121214;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:#dcdce0;user-select:text}
.lb-info .btns{display:flex;flex-wrap:wrap;gap:8px}
.lb-info .btns button{padding:8px 12px;border-radius:11px;background:var(--chip);font-size:13.5px}
.lb-info .btns button:hover{background:var(--chip-h)}
.lb-info .btns button.on{color:var(--pink)}
.lb-info .small{font-size:12px;color:var(--tx3)}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center}
.iconbtn:hover{background:var(--chip-h)}

/* 确认框 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:130;padding:16px}
.modal{background:#232528;border:1px solid #3d3f43;border-radius:24px;width:min(560px,100%);padding:22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:19px}
.modal table{width:100%;border-collapse:collapse;font-size:14px}
.modal td{padding:6px 0;vertical-align:top}
.modal td:first-child{color:var(--tx3);width:92px}
.modal .pp{white-space:pre-wrap;background:#1c1e21;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--tx2);max-height:160px;overflow:auto}
.modal .cost{font-size:22px;font-weight:700;color:var(--lime)}
.modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal .btns button{padding:11px 18px;border-radius:13px;background:var(--chip);font-weight:600}
.modal .btns button.go{background:var(--lime);color:#111}
.modal .btns button.danger{background:#5a1c28;color:#ffd0d8}
.modal .small{font-size:12px;color:var(--tx3);margin-top:8px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2e3033;border:1px solid #47494e;padding:11px 18px;border-radius:13px;z-index:140;font-size:14px;max-width:min(680px,90vw);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.bad{border-color:#7a2e3b;background:#34181e}
body.dragging .panel,body.dragging .dropzone{outline:2px dashed var(--lime-d);outline-offset:4px}
[hidden]{display:none !important}

/* 素材抽屉（生成框顶部） */
.card.on{outline:1.5px solid var(--lime-d);outline-offset:-1.5px}
.drawer{background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:12px}
.drawer .dh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.drawer .dh .sp{flex:1}
.drawer .dh input[type=search]{background:#1c1e21;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;outline:0;width:170px}
.drawer .dh label{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:5px;cursor:pointer;margin-right:4px}
.drawer .dh label input{accent-color:var(--lime)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:236px;overflow:auto;padding:2px}
.dt{position:relative;aspect-ratio:1;border-radius:12px;background:#1c1e21;border:1px solid var(--line);overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--tx3);font-size:11px;text-align:center}
.dt img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.dt:hover{border-color:#55555d}
.dt.on{outline:2px solid var(--lime);outline-offset:-2px}
.dt.ina{opacity:.35}
.dt .k{position:absolute;left:5px;top:5px;font-size:10.5px;background:rgba(0,0,0,.65);padding:0 5px;border-radius:5px;color:var(--tx2)}
.dt .ck{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--lime);color:#111;display:grid;place-items:center;font-size:12px;font-weight:800}
.dt .tg{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:600;background:rgba(0,0,0,.72);padding:1px 6px;border-radius:6px;color:var(--lime);max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:10.5px;color:#ddd;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.dt .used{position:absolute;right:5px;top:5px;font-size:10px;background:rgba(0,0,0,.65);padding:0 5px;border-radius:5px;color:var(--tx3)}
.dt.on .used{display:none}
.dt.up{border:1.5px dashed #3d3f43;background:transparent;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.dt.up:hover{border-color:var(--tx3);color:var(--tx)}
.pop .pk{display:grid;grid-template-columns:repeat(4,78px);gap:6px;padding:6px}

/* 首页、项目页：生成框 + 右边窄栏 */
body.railmode .work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.rail{min-width:0}
body.railmode .rail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:2px 12px 12px}
body.railmode .gal-h{margin:12px 2px 10px;gap:6px}
body.railmode .gal-h h2{font-size:15px}
body.railmode .gallery{grid-template-columns:1fr;gap:10px}
body.railmode .task{border-radius:14px}
body.railmode .task .body{padding:8px 10px 10px;gap:4px}
body.railmode .task .nm{font-size:12.5px}
body.railmode .task .meta{font-size:11.5px}
body.railmode .task .pr{display:none}
body.railmode .task .acts button{font-size:11.5px;padding:3px 8px}
body.railmode #openOut{display:none}
body.railmode .top{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
body.railmode .card{padding:9px 10px;gap:9px;border-radius:16px}
body.railmode .card .ico{width:36px;height:36px;border-radius:10px}
body.railmode .card .ico svg{width:20px;height:20px}
body.railmode .card .k{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.railmode .card .v{font-size:15px}
body.railmode .hero{margin:4px 0 16px}
body.railmode .hero h1{font-size:28px;margin-bottom:4px}
.railmore{display:block;width:100%;text-align:center;font-size:13px;color:var(--tx2);padding:9px;border-radius:12px;background:var(--chip);margin-top:10px;text-decoration:none}
.railmore:hover{background:var(--chip-h);color:var(--tx)}

/* 卡片上的一采、二采 */
.task .outs{display:flex;gap:5px;flex-wrap:wrap}
.task .outs button{font-size:11.5px;padding:2px 4px 2px 8px;border-radius:7px;background:#2b2d30;color:var(--tx2);display:flex;align-items:center;gap:2px}
.task .outs button.cur{color:var(--tx);background:#3d3f43}
.task .outs .h{padding:0 4px;color:var(--tx3);font-size:13px}
.task .outs .h:hover{color:var(--tx)}
.task .outs .h.on{color:var(--pink)}

/* 我的元素：多选 */
.elbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 14px;font-size:13.5px;color:var(--tx2)}
.elbar .sp{flex:1}
.elbar a{color:var(--tx2)}
.elbar button.go{background:var(--lime);color:#111;padding:7px 14px;border-radius:10px;font-weight:600}
.el .th{cursor:pointer}
.el .sel{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.6);background:rgba(0,0,0,.45);display:grid;place-items:center;color:#111;font-size:13px;font-weight:800}
.el.picked{outline:2px solid var(--lime);outline-offset:-1px}
.el.picked .sel{background:var(--lime);border-color:var(--lime)}
.el .placed{font-size:11.5px;color:var(--lime)}

/* 播放器：并排对比 */
.lb-v{display:grid;place-items:center;width:100%;height:100%;min-width:0}
.lb-v.cmp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lb-v figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.lb-v.cmp video{max-height:calc(100vh - 100px)}
.lb-v figcaption{font-size:13px;color:var(--tx2)}

@media (max-width:1250px){ .top{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1100px){
  body.railmode .work{display:block}
  body.railmode .rail{position:static;max-height:none;background:none;border:0;padding:0}
  body.railmode .gallery{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .editor{flex-direction:column}
  .lb{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .lb-info{max-height:40vh;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav .sec,.nav #projBox,.navfoot,.brand{display:none}
  .ni{width:auto}
  .main{padding:18px 16px 60px}
  .top{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){ .top{grid-template-columns:1fr} .gallery{grid-template-columns:1fr} .lb-stage{padding:16px 8px} .lb-nav{display:none} }
</style>
</head>

// ---------- 素材字段 ----------
function kindOf(field){ const k = S.cfg && (wf().格子类型 || {})[field]; if (k) return k; return field.includes('image') ? 'image' : field.includes('video') ? 'video' : field.includes('audio') ? 'audio' : null; }
// 标签写法：Seedance @image1、Kling @image_1、H3 工作流 <Picture 1>
function fmtTag(kind, n){ const m = model(); return m.标签.replace('{kind}', kind).replace('{Kind}', (m.标签类型 || {})[kind] || kind).replace('{n}', n); }
const TAG_RE = /@(image|video|audio)_?(\d+)|<(Picture|Video|Audio) (\d+)>/g;
const TAG_KIND = {Picture:'image', Video:'video', Audio:'audio'};
const tagKey = (m) => (m[1] || TAG_KIND[m[3]]) + ':' + (m[2] || m[4]);
function mediaFields(){
  const sc = schema(), props = sc.properties || {}, req = sc.required || [], any = sc.至少一项 || [], over = wf().字段名 || {};
  const out = [];
  for (const [k, v] of Object.entries(props)){
    const multi = v.type === 'array' && v.items && v.items.format === 'uri';
    const single = v.type === 'string' && v.format === 'uri';
    if (!multi && !single) continue;
    out.push({field:k, kind:kindOf(k), multi, max: multi ? (v.maxItems || 10) : 1, label: over[k] || FIELDNAME[k] || k,
              required: req.includes(k), anyOf: any.includes(k), isRef: multi && !over[k]});
    if (!out[out.length - 1].kind) out.pop();
  }
  // 单个的槽（首帧、源视频）排前面，尾帧放最后；同类里图片、视频、音频
  const rank = f => (f.multi ? 10 : /end|last/.test(f.field) ? 20 : 0) + ({image:0, video:1, audio:2}[f.kind] ?? 3);
  return out.sort((a, b) => rank(a) - rank(b));
}
function tagFor(f, idx){
  const m = model();
  if (f.isRef){
    let n = idx + 1;
    if (f.kind === 'video' && wf()['源视频占 @video_1']) n += 1;
    return fmtTag(f.kind, n);
  }
  if (f.field === 'video_url' && wf()['源视频占 @video_1']) return fmtTag('video', 1);
  return f.multi ? `${f.label}${idx + 1}` : f.label;
}
function allTags(){
  const out = [];
  for (const f of mediaFields()) (S.assign[f.field] || []).forEach((id, i) => {
    const t = tagFor(f, i); if (/^[@<]/.test(t)) out.push({tag:t, a:S.assets[id]});
  });
  return out.sort((x, y) => x.tag.localeCompare(y.tag, 'en', {numeric:true}));
}
function unassign(id){
  for (const k in S.assign) S.assign[k] = S.assign[k].filter(x => x !== id);
  S.shelf = S.shelf.filter(x => x !== id);
}
function place(id, field, beforeId){
  const a = S.assets[id]; if (!a) return;
  const fs = mediaFields();
  let f = field && fs.find(x => x.field === field);
  if (f && f.kind !== a.类型){ toast(`「${f.label}」要放${KINDNAME[f.kind]}，${a.名字} 是${KINDNAME[a.类型]}，已自动放到别处`, true); f = null; }
  if (!f){
    // 自动放：先空着的必填单槽 → 同类参考组 → 其他空单槽 → 搁架
    const free = x => (S.assign[x.field] || []).filter(y => y !== id).length < x.max;
    f = fs.find(x => !x.multi && x.kind === a.类型 && x.required && free(x))
     || fs.find(x => x.multi && x.kind === a.类型 && free(x))
     || fs.find(x => !x.multi && x.kind === a.类型 && free(x));
  }
  unassign(id);
  if (!f){ S.shelf.push(id); return; }
  const list = S.assign[f.field] || (S.assign[f.field] = []);
  if (!f.multi){ list.forEach(old => S.shelf.push(old)); S.assign[f.field] = [id]; return; }
  if (list.length >= f.max){ toast(`「${f.label}」最多 ${f.max} 个`, true); S.shelf.push(id); return; }
  const at = beforeId ? list.indexOf(beforeId) : -1;
  at >= 0 ? list.splice(at, 0, id) : list.push(id);
}
function reflow(){
  // 换模型/方式后，按原来的顺序把素材重新放一遍
  const order = [...Object.values(S.assign).flat(), ...S.shelf];
  S.assign = {}; S.shelf = [];
  const fields = new Set(mediaFields().map(f => f.field));
  for (const id of order) place(id);
  for (const k in S.assign) if (!fields.has(k)) delete S.assign[k];
}

// ---------- 参数 ----------
function params(){
  const ep = wf().endpoint, props = schema().properties || {};
  const p = S.paramsBy[ep] || (S.paramsBy[ep] = {});
  for (const [k, v] of Object.entries(props)){
    if (k === 'prompt' || mediaFields().some(f => f.field === k)) continue;
    if (!(k in p) && v.default !== undefined) p[k] = v.default;
    if (k === 'duration' && !(k in p) && v.minimum !== undefined) p[k] = Math.max(5, v.minimum);
  }
  return p;
}
function paramKeys(){
  const props = schema().properties || {}, media = new Set(mediaFields().map(f => f.field));
  return Object.keys(props).filter(k => k !== 'prompt' && !media.has(k));
}
const simpleParam = v => v.enum || v.type === 'integer' || v.type === 'boolean' || v.type === 'number' || v.type === 'string';

// ---------- 估价 ----------
function srcSeconds(){
  const id = (S.assign.video_url || [])[0]; return id ? (S.assets[id].秒 || 0) : 0;
}
function estimate(){
  const m = model(), c = m.计价, p = params(), res = p.resolution || '720p';
  if (c.方式 === '机器时长') return {each:null, gen:p.duration || 5};
  const vids = Object.entries(S.assign).filter(([k]) => kindOf(k) === 'video').flatMap(([, ids]) => ids).map(id => S.assets[id]);
  const hasVid = vids.length > 0;
  const gen = wf().时长跟源视频 ? Math.max(4, srcSeconds()) : (p.duration || 5);
  let usd;
  if (c.方式 === 'token'){
    const inDur = hasVid ? Math.min(30, vids.reduce((s, a) => s + (a.秒 || 0), 0)) : 0;
    const tokens = c.像素[res] * (gen + inDur) * 24 / 1024;
    usd = tokens / 1000 * c.每千token[res] * (hasVid ? c.有视频输入倍率 : 1);
  } else {
    usd = (hasVid ? c.有视频输入每秒 : c.每秒)[res] * gen;
  }
  return {each: usd * (S.cfg.当前折扣 || 1), gen};
}

function problems(){
  const out = [], sc = schema(), prompt = $('prompt').value.trim(), props = sc.properties || {};
  if (!wf()) return ['还没有工作流：到左边「工作流」里添加一个'];
  if (!model().启用) out.push(`${model().名称} 没有启用：${model().停用原因 || ''}`);
  if (wf().问题) out.push(wf().问题);
  if ((sc.required || []).includes('prompt') && !prompt) out.push('要写提示词');
  if (prompt && props.prompt && props.prompt.maxLength && prompt.length > props.prompt.maxLength) out.push(`提示词最多 ${props.prompt.maxLength} 字`);
  for (const f of mediaFields()){
    const n = (S.assign[f.field] || []).length;
    if (f.required && !n) out.push(`要放「${f.label}」`);
    if (!n && (wf().缺了不能跑 || {})[f.field]) out.push(wf().缺了不能跑[f.field]);
    if (n > f.max) out.push(`「${f.label}」最多 ${f.max} 个`);
  }
  // RunningHub 反向检查：参考格子放了素材，提示词（所有段合起来）里却没有 <Picture N> 这种标签——没定义的格子模型会自己拿去用
  if (isRH()){
    const SLOT = {image:'图像', video:'参考视频', audio:'参考音频'};
    const bad = [];
    for (const f of mediaFields()) if (f.isRef) (S.assign[f.field] || []).forEach((id, i) => {
      const t = tagFor(f, i);
      if (!prompt.includes(t)) bad.push(`${SLOT[f.kind] || f.label}${i + 1} 放了 ${S.assets[id]?.名字 || id}，但提示词里没有 ${t}`);
    });
    if (bad.length) out.push(bad.join('；') + '。没定义的格子模型会自己拿去用：要用就在提示词里定义，不用就清空');
  }
  const any = sc.至少一项 || [];
  if (any.length && !any.some(k => (S.assign[k] || []).length)) out.push('至少放一个参考素材（' + any.map(k => FIELDNAME[k] || k).join(' / ') + '）');
  const total = Object.values(S.assign).flat().length;
  if (total > 50) out.push('素材总数最多 50 个');
  if (S.pending.length) out.push('素材还在传进来…');
  if (!S.st.有RH密钥 && !S.st.演示) out.push('还没有 RunningHub API Key：点左下角填写');
  return out;
}

// 素材 id → 被哪些生成用过（最新的在前）
function usage(){
  const u = {};
  for (const t of S.tasks) for (const id of Object.values(t.素材 || {}).flat()){
    const x = u[id] || (u[id] = {n:0, last:'', who:[]});
    x.n++; if (t.创建 > x.last) x.last = t.创建;
    if (x.who.length < 4) x.who.push(`${t.前缀 || '未命名'}（${new Date(t.创建).toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'})}）`);
  }
  return u;
}
function libList(kind, q, f){
  const u = usage(); let l = S.lib.slice();
  if (f === 'recent') l = l.filter(a => u[a.id]).sort((a, b) => u[b.id].last.localeCompare(u[a.id].last));
  else if (f && f !== 'all') l = l.filter(a => a.类型 === f);
  if (kind) l = l.filter(a => a.类型 === kind);
  if (q) l = l.filter(a => a.名字.toLowerCase().includes(q.toLowerCase()));

}

function addFiles(files, field, libOnly){
  for (const f of files){
    const ph = {name:f.name, pct:0, field, lib:libOnly};
    S.pending.push(ph); if (!libOnly){ renderMedia(); renderGen(); }
    const x = new XMLHttpRequest();
    x.open('POST', '/api/assets');
    x.setRequestHeader('X-Name', encodeURIComponent(f.name));
    x.upload.onprogress = ev => { if (ev.lengthComputable){ ph.pct = ev.loaded / ev.total; libOnly ? renderElems() : renderMedia(); } };
    const done = () => { S.pending = S.pending.filter(p => p !== ph); };
    x.onload = () => {
      done(); let j; try { j = JSON.parse(x.responseText); } catch { j = {错误:'后台没有回应'}; }
      if (x.status >= 300 || j.错误) toast(`${f.name}：${j.错误 || x.status}`, true);
      else { S.assets[j.id] = j; if (!S.lib.some(a => a.id === j.id)) S.lib.unshift(j); renderCounts(); if (!libOnly){ const tag = putAsset(j.id, field, true); if (tag) toast(`${j.名字} → ${tag}`); } }
      if (libOnly) loadLib(); else { renderComposer(); saveDraft(); }
    };
    x.onerror = () => { done(); toast(`${f.name} 传不进来，后台还开着吗？`, true); libOnly ? renderElems() : renderComposer(); };
    x.send(f);
  }
  if (libOnly) renderElems();
}
const composerOn = () => S.view === 'home' || S.view === 'project';
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (hasFiles(e)){ dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0){ dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => {
  e.preventDefault();
  document.querySelectorAll('.grp.hot,.drop-before').forEach(x => x.classList.remove('hot', 'drop-before'));
  const g = e.target.closest('.grp'); if (g && (hasFiles(e) || dragId)) g.classList.add('hot');
  const t = e.target.closest('.tile[data-id]'); if (t && dragId && t.dataset.id !== dragId && t.dataset.field) t.classList.add('drop-before');

addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  document.querySelectorAll('.grp.hot,.drop-before').forEach(x => x.classList.remove('hot', 'drop-before'));
  const g = e.target.closest('.grp'), field = g ? g.dataset.field || null : null;
  if (hasFiles(e)){
    if (S.view === 'elements') addFiles([...e.dataTransfer.files], null, true);

  if (dragId){
    const before = e.target.closest('.tile[data-id]');
    if (g && g.classList.contains('shelf')){ unassign(dragId); S.shelf.push(dragId); }
    else if (field){
      place(dragId, field, before && before.dataset.id !== dragId ? before.dataset.id : null);
      const tag = dragLib && assignedTag(dragId); if (tag && S.autoTag) autoTag(tag);
    }
    dragId = null; dragLib = false; renderComposer(); saveDraft();
  }
});

function buildParams(){

}
function snapshot(){ return {mi:S.mi, wi:S.wi, endpoint:wf().endpoint, prompt:$('prompt').value, paramsBy:{[wf().endpoint]:{...params()}}, assign:JSON.parse(JSON.stringify(S.assign)), prefix:S.prefix, count:S.count}; }

const STATUS = {uploading:'上传素材中', queued:'排队中', in_progress:'生成中', completed:'完成', failed:'失败', nsfw:'被内容审核拦下', canceled:'已取消'};

function shownFile(e){

function galleryList(){
  let list = S.tasks;
  if (S.view === 'home') list = list.filter(t => !t.项目);
  else if (S.view === 'project'){ const fam = famOf(S.pid); list = list.filter(t => fam.includes(t.项目)); }
  else if (S.view === 'favs') list = list.flatMap(t => favFiles(t).map(f => ({...t, _file:f, _key:t.id + '|' + f})));
  const f = S.galFilter;
  if (f === 'done') list = list.filter(t => t.状态 === 'completed');
  else if (f === 'run') list = list.filter(t => !DONE.includes(t.状态));
  else if (f === 'bad') list = list.filter(t => ['failed', 'nsfw', 'canceled'].includes(t.状态));
  else if (f.startsWith('m:')) list = list.filter(t => t.模型 === f.slice(2));

}
function taskSig(t){ return [t.状态, t.等待, t.视频, t.错误, t.提示, favFiles(t).join(','), shownFile(t), t.项目, (t.产出 || []).length, S.view].join('|'); }

      ${file ? `<button class="fav ${isFav(t, file) ? 'on' : ''}" data-t="fav" title="${isFav(t, file) ? '取消收藏这一份' : '收藏这一份'}">${isFav(t, file) ? I.heartOn : I.heart}</button>` : ''}</div>
    <div class="body"><div class="nm">${esc(vname(t, file))}</div>
    ${outs.length && !t._file ? `<div class="outs">${outs.map(x => `<button data-t="show" data-f="${esc(x.视频)}" class="${x.视频 === file ? 'cur' : ''}" title="在卡片上看${esc(x.名称)}">${esc(x.名称)}<span class="h ${isFav(t, x.视频) ? 'on' : ''}" data-t="favf" data-f="${esc(x.视频)}" title="${isFav(t, x.视频) ? '取消收藏' : '收藏'}${esc(x.名称)}">${isFav(t, x.视频) ? '♥' : '♡'}</span></button>`).join('')}</div>` : ''}${showProj ? `<span class="ptag">${pj ? esc(pj.名称) : '不归项目'}</span>` : ''}<div class="meta">${esc(meta)}</div><div class="pr">${esc(p.prompt || '')}</div>

const railOn = () => composerOn();
function renderGallery(){
  const g = $('gallery'), all = galleryList();
  const running = all.filter(t => !DONE.includes(t.状态)).length;
  $('galN').textContent = all.length ? `${all.length} 条${running ? ` · 进行中 ${running}` : ''}` : '';
  let list = all;
  if (railOn()){
    list = [...all.filter(t => !DONE.includes(t.状态)), ...all.filter(t => DONE.includes(t.状态))];
    list = list.slice(0, Math.max(S.railN, running));
  }
  const more = $('railMore');
  more.hidden = !railOn() || !all.length;
  more.textContent = list.length < all.length ? `再显示 ${Math.min(30, all.length - list.length)} 条（共 ${all.length} 条）` : S.view === 'home' ? '所有项目的生成 → 我的生成' : '全部显示了';
  more.dataset.m = list.length < all.length ? 'more' : 'gens';
  if (!list.length){
    const msg = {home:'首页的生成（不归项目）会显示在这里。', project:'这个项目还没有生成。在上面提交后，进度和成片都在这里。', favs:'还没有收藏。点视频右上角的心形就能收藏。', gens:'还没有生成。'}[S.view] || '';
    g.innerHTML = `<div class="empty">${S.galFilter !== 'all' ? '没有符合筛选条件的。' : msg}</div>`; S.cards.clear(); return;
  }
  g.querySelector('.empty')?.remove();
  const keep = new Set();
  list.forEach((t, i) => {
    keep.add(t._key);
    let c = S.cards.get(t._key);
    if (!c){ c = {el:document.createElement('div'), sig:''}; c.el.className = 'task'; c.el.dataset.id = t.id; c.el.dataset.key = t._key; S.cards.set(t._key, c); }
    c.el.dataset.file = shownFile(t) || '';

    if (g.children[i] !== c.el) g.insertBefore(c.el, g.children[i] || null);

  for (const [id, c] of S.cards) if (!keep.has(id)){ c.el.remove(); S.cards.delete(id); }

async function taskAction(what, t, file){
  file = file || t.视频;
  if (what === 'open') openLB(t.id, file);
  else if (what === 'reveal') await api('/api/reveal', {p:file});
  else if (what === 'fav'){
    if (!file) return;
    const on = !isFav(t, file);
    await api(`/api/tasks/${t.id}/fav`, {文件:file, 收藏:on});
    t.收藏文件 = favFiles(t).filter(x => x !== file).concat(on ? [file] : []); t.收藏 = t.收藏文件.length > 0;
    renderGallery(); renderCounts(); if (S.lb) renderLB();
    const out = (t.产出 || []).find(x => x.视频 === file);
    toast(`${on ? '已收藏' : '已取消收藏'}${out ? out.名称 : ''}`);
  }
  else if (what === 'again') await again(t);
  else if (what === 'cancel'){
    if (t.平台 === 'runninghub'){
      const got = (t.产出 || []).map(x => x.名称).join('、');
      const ok = await confirmBox('取消这条任务', `取消后 RunningHub 上这条任务就没了，<b>还没下载的那一采拿不到</b>${got ? `（已下载：${esc(got)}，不受影响）` : ''}。<br>已经跑掉的机器时长照样扣。`, '取消任务', true);
      if (!ok) return;
    }
    await api(`/api/tasks/${t.id}/cancel`, {}); pollTasks();
  }
  else if (what === 'remove'){ await api(`/api/tasks/${t.id}/remove`, {}); pollTasks(); }
  else if (what === 'reuse'){
    closeLB();
    location.hash = t.项目 && project(t.项目) ? '#/p/' + t.项目 : '#/home';
    await route();
    await loadForm(t.表单); window.scrollTo({top:0, behavior:'smooth'}); toast('已经把这组设置放回生成框');
  }
}
// 换种子再来一条：同一套设置和素材，直接再交一条（不动生成框里正在写的东西）
async function again(t){
  const w = wayOf(t.endpoint); if (!w) throw new Error('这条用的工作流已经不在工作流库里了，用「用这组设置」换一个再交');
  const p = {...t.参数};
  if ('种子' in p) p.种子 = ''; delete p.seed;
  const form = t.表单 ? JSON.parse(JSON.stringify(t.表单)) : null;
  for (const pp of Object.values((form && form.paramsBy) || {})){ if ('种子' in pp) pp.种子 = ''; delete pp.seed; }
  const rhx = t.平台 === 'runninghub', pid = t.项目 && project(t.项目) ? t.项目 : null;
  const ok = await confirmBox('换种子再来一条', `用「${esc(vname(t, t.视频))}」的同一套设置、同样的素材，再交 <b>1 条</b>到 ${rhx ? 'RunningHub' : 'Higgsfield'}，种子随机。<br>
    项目：${pid ? esc(project(pid).名称) : '不归项目（首页）'}<br>存到：${esc(t.输出目录)}<br>预计：<b style="color:var(--lime)">${rhx ? '按机器运行时长扣 RH 币' : t.估价 != null ? '约 $' + t.估价.toFixed(2) : '—'}</b>${S.st.演示 ? '（演示，不扣费）' : ''}`, S.st.演示 ? '提交（演示）' : '确认提交，会扣费');
  if (!ok) return;
  await api('/api/submit', {endpoint:t.endpoint, 参数:p, 素材:t.素材, 数量:1, 前缀:t.前缀, 输出目录:t.输出目录, 项目:pid, 估价:t.估价 ?? null, 表单:form});
  toast('已再交 1 条，种子随机'); pollTasks();
}

function lbFile(t){ return S.lb.file && (S.lb.file === t.视频 || (t.产出 || []).some(x => x.视频 === S.lb.file)) ? S.lb.file : t.视频; }
// 并排对比：右边跟着左边播放、暂停、拖进度
function syncPair(a, b, at){
  a.onloadedmetadata = () => { if (at) a.currentTime = Math.min(at, a.duration || at); a.play().catch(() => {}); };
  a.onplay = () => b.play().catch(() => {}); a.onpause = () => b.pause();
  a.onseeking = a.onseeked = () => { b.currentTime = a.currentTime; };
  a.ontimeupdate = () => { if (Math.abs(b.currentTime - a.currentTime) > 0.1) b.currentTime = a.currentTime; };
}
function renderLB(){

    <div class="btns"><button data-t="fav" class="${isFav(t, cur) ? 'on' : ''}">${isFav(t, cur) ? '♥ 已收藏' : '♡ 收藏'}${outs.length > 1 ? (outs.find(x => x.视频 === cur) || {}).名称 || '' : ''}</button><button data-t="reuse">用这组设置</button>${DONE.includes(t.状态) ? '<button data-t="again">换种子再来</button>' : ''}<button data-t="reveal">在文件夹里显示</button></div>

function syncLB(){

function step(d){ const list = lbList(), i = list.findIndex(x => x._key === S.lb.key); const n = list[i + d]; if (n){ S.lb.id = n.id; S.lb.key = n._key; S.lb.file = shownFile(n); S.lb.cmp = false; renderLB(); } }

function renderProjects(force){

  const walk = (parent, lv) => sort(kidsOf(parent)).forEach(p => { const kids = kidsOf(p.id).length; rows.push([p, lv, kids]); if (kids && !shut.includes(p.id)) walk(p.id, lv + 1); });

function startRename(){

// ---------- 页面 ----------
function projStats(pid){
  const fam = famOf(pid), ts = S.tasks.filter(t => fam.includes(t.项目) && !t.演示 === !S.st.演示);
  if (!ts.length) return '';
  const ok = ts.filter(t => t.状态 === 'completed'), bad = ts.filter(t => t.状态 === 'failed' || t.状态 === 'nsfw'), stop = ts.filter(t => t.状态 === 'canceled'), run = ts.length - ok.length - bad.length - stop.length;
  const mins = ok.map(t => (new Date(t.完成) - new Date(t.创建)) / 60000).filter(x => x > 0), avg = mins.length ? mins.reduce((a, b) => a + b, 0) / mins.length : 0;
  const plat = ts.reduce((n, t) => n + Math.max(0, ...(t.产出 || []).map(x => +x.耗时 || 0)), 0);
  const favs = ts.reduce((n, t) => n + favFiles(t).length, 0);
  const cell = (k, v) => `<div><b>${v}</b><span>${k}</span></div>`;
  return `<div class="pstats">${cell('条生成', ts.length)}${cell('完成', ok.length)}${run ? cell('进行中', run) : ''}${bad.length ? cell('失败', bad.length) : ''}${stop.length ? cell('取消', stop.length) : ''}${avg ? cell('平均出片', avg < 60 ? avg.toFixed(1) + ' 分钟' : (avg / 60).toFixed(1) + ' 小时') : ''}${plat ? cell('平台运行合计', plat < 3600 ? Math.round(plat / 60) + ' 分钟' : (plat / 3600).toFixed(1) + ' 小时') : ''}${favs ? cell('收藏', favs) : ''}</div>`;
}

  else if (S.view === 'project'){

    h.innerHTML = p ? `<div class="vh"><h1 title="点击重命名" style="cursor:text">${esc(p.名称)}</h1><span class="sub">${pathOf(p.id).length > 1 ? esc(pathOf(p.id).slice(0, -1).map(x => x.名称).join(" / ")) + " / · " : ""}${kidsOf(p.id).length ? "含子项目的生成 · " : ""}出片到 ${esc(p.输出目录)}</span><div class="sp"></div><div class="acts">${dirBtn}<button class="ghost" data-h="rename">重命名</button><button class="ghost" data-h="del">删除项目</button></div></div>${projStats(p.id)}` : '';
  }
  else h.innerHTML = `<div class="vh"><h1>${{gens:'我的生成', elements:'我的元素', favs:'我的收藏', workflows:'工作流'}[S.view]}</h1><span class="sub">${{gens:'所有项目的全部生成', elements:'拖进来过的图片、视频、音频；点「放进生成框」再用', favs:'点过心形的视频（一采、二采各自收藏）', workflows:'存下常用的工作流 ID，生成时在「工作流」卡片里选'}[S.view]}</span>${S.view === 'gens' || S.view === 'elements' ? '<div class="acts" style="margin-left:auto"><button class="ghost" data-h="clear">清空列表</button></div>' : ''}</div>`;
}
$('viewHead').addEventListener('click', e => {

async function clearList(){
  try {
    if (S.view === 'gens'){
      const mine = S.tasks.filter(t => !t.演示 === !S.st.演示), done = mine.filter(t => ['completed', 'failed', 'nsfw', 'canceled'].includes(t.状态));
      const favN = done.filter(t => favFiles(t).length).length, n = done.length - favN, run = mine.length - done.length;
      if (!n) return toast(mine.length ? '没有可清的：剩下的都在生成或收藏过' : '列表已经是空的');
      if (!await confirmBox('清空我的生成', `清掉 <b>${n}</b> 条生成记录（所有项目的）？<br>只清记录，<b>出片文件夹里的视频都不动</b>。${favN ? `<br>收藏过的 ${favN} 条留着。` : ''}${run ? `<br>正在生成的 ${run} 条留着。` : ''}<br>清掉的记录找不回来。`, `清掉 ${n} 条`, true)) return;
      const r = await api('/api/tasks/clear', {留收藏:true}); await pollTasks(); renderProjects(); toast(`已清掉 ${r.删了} 条记录，视频文件没动`);
    } else {
      await ensureComposer();
      const inUse = new Set([...Object.values(S.assign || {}).flat(), ...(S.shelf || [])]);
      const ids = S.lib.map(a => a.id).filter(id => !inUse.has(id)), kept = S.lib.length - ids.length;
      if (!ids.length) return toast(S.lib.length ? '剩下的素材都在生成框里用着，先从生成框拿掉' : '列表已经是空的');
      if (!await confirmBox('清空我的元素', `清掉 <b>${ids.length}</b> 个素材？<br>清的是工作台里存的副本，<b>你电脑上的原文件不动</b>；以后要用再拖进来。${kept ? `<br>现在放在生成框里的 ${kept} 个留着。` : ''}<br>清掉的找不回来。`, `清掉 ${ids.length} 个`, true)) return;
      const r = await api('/api/assets/clear', {ids}); ids.forEach(id => S.elSel.delete(id)); await loadLib(); toast(`已清掉 ${r.删了} 个素材${r.留下 ? `，${r.留下} 个正在上传的留着` : ''}`);
    }
  } catch (err){ toast(err.message, true); }
}

async function route(){
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  let view = h, pid = null;
  if (h.startsWith('p/')){ view = 'project'; pid = h.slice(2); if (!project(pid)){ location.hash = '#/home'; return; } }
  if (!['home', 'gens', 'elements', 'favs', 'project', 'workflows'].includes(view)) view = 'home';
  const changed = view !== S.view || pid !== S.pid;
  S.view = view; S.pid = pid;
  if (changed){ S.galFilter = 'all'; closePop(); }
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === view));
  const comp = composerOn();
  if (changed) S.railN = 30;
  document.body.classList.toggle('railmode', comp);
  (comp ? $('rail') : $('galHome')).appendChild($('galBox'));
  $('composer').hidden = !comp;
  $('elemView').hidden = view !== 'elements';
  $('galBox').hidden = view === 'elements' || view === 'workflows';
  $('wfView').hidden = view !== 'workflows';
  if (view === 'workflows') renderWorkflows();
  $('openOut').hidden = !comp;
  $('galTitle').textContent = {home:'最近生成', project:'这个项目的生成', gens:'全部', favs:'收藏'}[view] || '';
  if (comp){
    S.lastComposer = location.hash || '#/home';
    const ctx = view === 'project' ? pid : null;
    if (ctx !== S.ctx){ if (S.ctx !== undefined) saveDraft(); S.ctx = ctx; await loadDraft(); }
  }
  renderHead(); renderFilters(); renderProjects();
  if (view === 'elements') loadLib(); else renderGallery();
  if (comp) renderDrawer();
  if (changed) window.scrollTo(0, 0);
}

const draftKey = () => 'hf-draft:' + (S.ctx || 'home');
function saveDraft(){ if (S.ctx === undefined) return; try { localStorage.setItem(draftKey(), JSON.stringify({...snapshot(), paramsBy:S.paramsBy, shelf:S.shelf, outDir:S.outDir})); } catch {} }
async function loadDraft(){
  let d = null; try { d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); } catch {}
  S.assign = {}; S.shelf = []; S.prefix = ''; S.count = 1; $('prompt').value = ''; S.caret = null;
  if (d) await loadForm(d); else renderComposer();
}
async function loadForm(d){
  if (!d) return;
  const mi = S.cfg.models.findIndex(m => m.方式.some(w => w.endpoint === d.endpoint));
  if (mi >= 0){ S.mi = mi; S.wi = S.cfg.models[mi].方式.findIndex(w => w.endpoint === d.endpoint); }
  Object.assign(S.paramsBy, d.paramsBy || {});
  S.prefix = d.prefix || ''; S.count = d.count || 1; if (d.outDir && !S.ctx && !d.outDir.includes('/Higgsfield生成/')) S.outDir = d.outDir;  // 工具文件夹改过名，旧草稿里的旧路径不要
  $('prompt').value = d.prompt || '';
  const ids = [...new Set([...Object.values(d.assign || {}).flat(), ...(d.shelf || [])])];
  await Promise.all(ids.filter(id => !S.assets[id]).map(async id => { try { const a = await api('/api/assets/' + id); if (a.id) S.assets[id] = a; } catch {} }));
  S.assign = {}; S.shelf = [];
  for (const [k, v] of Object.entries(d.assign || {})) S.assign[k] = v.filter(id => S.assets[id]);
  S.shelf = (d.shelf || []).filter(id => S.assets[id]);
  const fields = new Set(mediaFields().map(f => f.field));
  if (Object.keys(S.assign).some(k => !fields.has(k))) reflow();
  renderComposer(); saveDraft();
}

  catch (err){ document.body.innerHTML = `<div style="padding:30px"><div class="banner">连不上后台：${esc(err.message)}。重新双击「启动」再刷新。</div></div>`; return; }

// 首次使用引导：Key → 工作流 → 项目。前两步没做完一直显示；都做完后，建了项目、出过片或点了「不再显示」就收起
function renderGuide(){
  if (!S.cfg || !S.st) return;
  const key = S.st.有RH密钥 || S.st.演示, wfOk = model().方式.some(w => w.workflowId && !w.问题), proj = S.projects.length > 0;
  let off = false; try { off = localStorage.getItem('h3-guide-off') === '1'; } catch {}
  const show = !key || !wfOk || (!proj && !S.tasks.length && !off);
  const sig = show ? [key, wfOk, proj].join() : '';
  if ($('banner').dataset.sig === sig) return;
  $('banner').dataset.sig = sig;
  if (!show){ $('banner').innerHTML = ''; return; }
  const step = (n, ok, title, sub, act, btn) => `<div class="gstep ${ok ? 'ok' : ''}"><i>${ok ? '✓' : n}</i><div><b>${title}</b><span>${sub}</span></div>${ok ? '' : `<button class="ghost" data-g="${act}">${btn}</button>`}</div>`;
  $('banner').innerHTML = `<div class="guide"><div class="gh">开始使用，三步${key && wfOk ? `<button class="ghost" data-g="off" style="margin-left:auto">不再显示</button>` : ''}</div>
    ${step(1, key, '填 RunningHub API Key', S.st.演示 ? '演示模式不需要' : key ? `已加密保存在${esc(S.st.密钥存放 || '本机')}` : '在 RunningHub 个人中心的「API 调用」里复制；会加密保存在这台电脑上', 'key', '填写 Key')}
    ${step(2, wfOk, '添加工作流', wfOk ? `已有 ${model().方式.filter(w => w.workflowId && !w.问题).length} 个可用` : '贴上 RunningHub 工作流的 ID，会自动核对能不能用', 'wf', '去添加')}
    ${step(3, proj, '新建项目（可选）', proj ? `已有 ${S.projects.length} 个项目` : '按片子、场次、镜头分开放，最多四层；不建也能直接在首页生成', 'proj', '新建项目')}</div>`;
}

      const r = await api('/api/key', {key:inp.value}); inp.value = '';
      S.st = await api('/api/state'); S.acct = r.账户; renderKeyPill(); if (composerOn()) renderComposer(); bg.remove();
      toast(r.已验证 ? `Key 验证通过，已保存${r.账户 && r.账户.余额 != null ? '；余额 ' + r.账户.余额 : ''}` : S.st.演示 ? '演示模式：已保存，没有连平台验证' : '已保存，但没能连上 RunningHub 验证（网络或 VPN？）', !r.已验证 && !S.st.演示);
    } catch (err){ msg.textContent = err.message; }
  };
  inp.onkeydown = e => { if (e.key === 'Enter') save(); };
  bg.onclick = async e => {
    const x = e.target.closest('[data-x]')?.dataset.x;
    if (e.target === bg || x === 'no') bg.remove();
    else if (x === 'ok') save();
    else if (x === 'del'){ bg.remove(); if (!await confirmBox('删除已存的 Key', '删掉后要重新填才能提交。', '删除', true)) return; await api('/api/key/delete', {}); S.st = await api('/api/state'); S.acct = null; renderKeyPill(); if (composerOn()) renderComposer(); toast('已删除保存的 Key'); }
  };
}
$('keyPill').onclick = keyBox;
$('quitBtn').onclick = async () => {
  const live = S.tasks.filter(t => !t.演示 === !S.st.演示 && ['uploading', 'queued', 'in_progress'].includes(t.状态));
  const up = live.filter(t => t.状态 === 'uploading').length, run = live.length - up;
  const warn = (run ? `<br><b>还有 ${run} 条在 RunningHub 上跑</b>：退出后平台上照样跑、照样扣费；下次打开工作台会接着查进度、下载（一采要等整条跑完才下）。` : '')
    + (up ? `<br><b>有 ${up} 条正在上传</b>：退出后这几条不会提交（不扣费），下次打开显示为失败。` : '');
  if (!await confirmBox('退出工作台', `停掉工作台的后台程序：之后不再运行、不再连 RunningHub，这个网页也会失效。${warn}<br>下次用时双击「启动.command」（免安装包是「启动.command / 启动.bat」）再打开。`, '退出', !!live.length)) return;
  try { await api('/api/quit', {}); } catch {}
  document.body.insertAdjacentHTML('beforeend', '<div class="quit-page"><div><h2>工作台已退出</h2><p>后台已经停了，不再连 RunningHub。</p><p>这个网页可以关掉；那个黑色终端窗口也可以关掉。</p><p style="margin-top:14px;color:var(--tx3)">下次用时双击「启动.command」。</p></div></div>');
  S.quit = true;
};

// ---------- 工作流库 ----------
async function reloadCfg(keepEp){
  const ep = keepEp || (wf() || {}).endpoint;
  S.cfg = await api('/api/models');
  const j = model().方式.findIndex(w => w.endpoint === ep);
  S.wi = j >= 0 ? j : Math.min(S.wi, model().方式.length - 1);
  $('cntWf').textContent = model().方式.filter(w => w.workflowId).length || '';
  renderGuide();
}
async function renderWorkflows(){
  let list;
  try { list = await api('/api/workflows'); } catch (err){ $('wfList').innerHTML = `<div class="banner">${esc(err.message)}</div>`; return; }
  const cur = (wf() || {}).endpoint;
  const use = {}; for (const t of S.tasks){ const u = use[t.endpoint] || (use[t.endpoint] = {n:0, last:''}); u.n++; if (t.创建 > u.last) u.last = t.创建; }
  $('wfList').innerHTML = list.length ? list.map(e => {
    const c = e.核对 || {}, u = use[e.endpoint];
    return `<div class="wfrow ${e.endpoint === cur ? 'cur' : ''}" data-id="${e.id}" data-ep="${esc(e.endpoint)}">
      <div class="nm"><span data-w="name" title="点击改名">${esc(e.名称)}</span><span class="tag">${esc(e.结构 || '')}</span>${e.endpoint === cur ? '<span class="tag" style="color:var(--lime)">生成框正在用</span>' : ''}</div>
      <div class="acts"><button class="ghost" data-w="use">用它生成</button><button class="ghost" data-w="check">重新核对</button><button class="ghost" data-w="del">删除</button></div>
      <div class="meta"><code data-w="copy" title="点击复制">ID ${esc(e.workflowId)}</code><span class="note" data-w="note" title="点击改备注">${esc(e.备注) || '加备注'}</span>
        <span>${u ? `用过 ${u.n} 次，最近 ${esc(u.last.slice(5, 16).replace('T', ' '))}` : '还没用过'}</span>
        ${c.结果 === '通过' ? `<span class="ok">核对通过 · ${c.节点数} 个节点 · ${esc((c.时间 || '').slice(5, 16).replace('T', ' '))}</span>` : c.结果 ? `<span>${esc(c.结果)}</span>` : '<span>还没核对</span>'}</div>
      ${(c.问题 || []).length ? `<div class="bad">和窗口对不上，这个工作流现在提交不了：<br>${c.问题.map(esc).join('<br>')}</div>` : ''}
    </div>`; }).join('') : `<div class="hero"><h1 style="font-size:26px">添加你的第一个工作流</h1><p>把 RunningHub 上工作流页面地址里那串数字贴到上面</p></div>`;
}
$('wfAdd').onclick = async () => {
  const b = $('wfAdd'); if (!$('wfId').value.trim()){ toast('先贴上工作流 ID', true); $('wfId').focus(); return; }
  b.disabled = true; b.textContent = '核对中…';
  try {
    const e = await api('/api/workflows', {workflowId:$('wfId').value, 名称:$('wfName').value, 备注:$('wfNote').value});
    $('wfId').value = $('wfName').value = $('wfNote').value = '';
    await reloadCfg(); await renderWorkflows();
    const bad = ((e.核对 || {}).问题 || []).length;
    toast(bad ? `已添加「${e.名称}」，但和窗口对不上，看列表里的说明` : `已添加「${e.名称}」：${e.结构}，核对通过`, !!bad);
  } catch (err){ toast(err.message, true); }
  b.disabled = false; b.textContent = '添加并核对';
};
$('wfId').addEventListener('keydown', e => { if (e.key === 'Enter') $('wfAdd').click(); });
$('wfList').addEventListener('click', async e => {
  const el = e.target.closest('[data-w]'), row = e.target.closest('.wfrow'); if (!el || !row) return;
  const id = row.dataset.id, ep = row.dataset.ep, w = el.dataset.w;
  const name = row.querySelector('[data-w=name]').textContent;
  try {
    if (w === 'copy'){ await navigator.clipboard.writeText(el.textContent.replace('ID ', '')); toast('ID 已复制'); }
    else if (w === 'use'){ const j = model().方式.findIndex(x => x.endpoint === ep); if (j < 0) return; S.wi = j; reflow(); saveDraft(); location.hash = S.ctx ? '#/p/' + S.ctx : '#/home'; toast(`生成框换成「${name}」`); }
    else if (w === 'check'){ el.textContent = '核对中…'; const r = await api('/api/workflows/' + id, {核对:true}); await reloadCfg(); await renderWorkflows(); const bad = (r.核对.问题 || []).length; toast(bad ? `「${name}」和窗口对不上` : `「${name}」核对通过（${r.结构}）`, !!bad); }
    else if (w === 'del'){ if (!await confirmBox('从工作流库删除', `删除「${esc(name)}」？<br>只是从这个列表里拿掉，RunningHub 上的工作流和已经出的片都不动。`, '删除', true)) return; await api(`/api/workflows/${id}/delete`, {}); await reloadCfg(); await renderWorkflows(); }
    else if (w === 'name' || w === 'note'){
      if (el.querySelector('input')) return;
      const key = w === 'name' ? '名称' : '备注', old = w === 'note' && el.textContent === '加备注' ? '' : el.textContent;
      el.innerHTML = `<input value="${esc(old)}" style="padding:4px 8px;width:${w === 'name' ? 320 : 260}px">`;
      const inp = el.firstChild; inp.focus(); inp.select();
      const done = async save => { if (save && inp.value.trim() !== old && (w === 'note' || inp.value.trim())){ try { await api('/api/workflows/' + id, {[key]:inp.value}); await reloadCfg(); } catch (err){ toast(err.message, true); } } renderWorkflows(); };
      inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); if (ev.key === 'Escape'){ inp.onblur = null; done(false); } };
      inp.onblur = () => done(true);
    }
  } catch (err){ toast(err.message, true); renderWorkflows(); }
});
boot();
</script>
</body>
</html>
